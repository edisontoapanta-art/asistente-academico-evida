<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente Académico EVIDA</title><meta name="description" content="Herramienta para desarrollar, documentar, revisar y entregar actividades ACD, APE y AA con el ciclo EVIDA.">
<style id="appcss">

*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}

p{margin:0 0 .75rem}
a{color:var(--brand2)}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:.5rem 1rem;z-index:100}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* cabecera */
.top{background:var(--brand);color:#fff}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:10px;color:#fff;text-decoration:none}
.brand b{font-family:var(--serif);font-size:1.35rem;letter-spacing:.04em}
.brand span{font-size:.8rem;opacity:.9}
.brand-letters{display:inline-flex;gap:3px;margin-right:2px}
.brand-letters i{font-style:normal;font-weight:700;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:.8rem;color:#fff}
.nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:.95rem;min-height:44px;display:inline-flex;align-items:center}
.nav a:hover{background:rgba(255,255,255,.14)}
.nav a[aria-current="page"]{background:#fff;color:var(--brand);font-weight:600}
.rol{display:inline-flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px}
.rol button{border:0;background:transparent;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:.9rem;min-height:40px}
.rol button[aria-pressed="true"]{background:#fff;color:var(--brand);font-weight:600}
.savestat{font-size:.8rem;opacity:.9}
main{padding:20px 0 120px}
.foot{font-size:.82rem;color:var(--muted);padding:16px 0 90px;border-top:1px solid var(--line);margin-top:24px}

/* botones */
.btn{font:inherit;font-size:.95rem;border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--info-bg)}
.btn.pri{background:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}
.btn.sm{padding:5px 11px;min-height:36px;font-size:.85rem}
.btn.dng{border-color:var(--err);color:var(--err)}.btn.dng:hover{background:var(--err-bg)}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.mt{margin-top:16px}.mb{margin-bottom:16px}

/* tarjetas y campos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{margin-bottom:.4rem}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field>label,fieldset legend{font-size:.9rem;font-weight:600}
.req{color:var(--err)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:.95rem;border:1.5px solid #9aa3ae;border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink);width:100%;min-height:42px}
textarea{resize:vertical;min-height:72px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
fieldset{border:0;padding:0;margin:0 0 10px;min-width:0}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #9aa3ae;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.92rem;font-weight:400;min-height:42px;background:#fff}
.radios label:has(input:checked){border-color:var(--brand);background:var(--info-bg);font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;margin-bottom:8px}
.check input{margin-top:4px;width:18px;height:18px}
.tipos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tipos label{border:1.5px solid #9aa3ae;border-radius:10px;padding:12px;cursor:pointer;background:#fff;display:block}
.tipos label:has(input:checked){border-color:var(--brand);background:var(--info-bg);box-shadow:inset 0 0 0 1px var(--brand)}
.tipos b{font-family:var(--serif);font-size:1.15rem;color:var(--brand)}
.tipos input{margin-right:6px}

/* avisos */
.callout{border-radius:8px;padding:10px 14px;margin:0 0 12px;border-left:5px solid;font-size:.93rem}
.callout.info{background:var(--info-bg);border-color:var(--info)}
.callout.ok{background:var(--ok-bg);border-color:var(--ok);color:#12441f}
.callout.warn{background:var(--warn-bg);border-color:#c98a00;color:#4f3000}
.callout.err{background:var(--err-bg);border-color:var(--err);color:#6b1212}
.callout ul{margin:.3rem 0 0;padding-left:1.2rem}
.callout b.t{display:block;margin-bottom:2px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--info-bg);color:var(--brand);border:1px solid #c5d0e0;margin:0 4px 4px 0}
.chip.demo{background:#fff3d6;color:#4f3000;border-color:#e0b040}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:#a8d4b8}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:#e0b040}
.chip.err{background:var(--err-bg);color:var(--err);border-color:#e3a3a3}
.demo-band{background:#fff3d6;border:1.5px dashed #c98a00;color:#4f3000;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:.9rem;font-weight:600}

/* barra de progreso y pasos */
.worktop{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;position:sticky;top:0;z-index:20}
.worktop h1{font-size:1.1rem;margin:0}
.worktop .meta{font-size:.85rem;color:var(--muted)}
.pbar{height:10px;background:#e5e1d6;border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px;padding:0;list-style:none}
.steps li{display:contents}
.step{font:inherit;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer;min-height:40px;color:var(--ink)}
.step .bd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:.9rem;background:#6b7580}
.step .lb{font-size:.88rem}
.step[aria-current="step"]{border-width:2.5px;font-weight:700}
.step.done .bd::after{content:"✓";font-size:.6rem;margin-left:1px}
.step[disabled]{opacity:.55;cursor:not-allowed;background:#f1eee6}
.step.E .bd{background:var(--e)}.step.I .bd{background:var(--i)}.step.V .bd{background:var(--v)}.step.D .bd{background:var(--d)}.step.A .bd{background:var(--a)}
.step.E[aria-current="step"]{border-color:var(--e);background:var(--e-bg)}.step.I[aria-current="step"]{border-color:var(--i);background:var(--i-bg)}
.step.V[aria-current="step"]{border-color:var(--v);background:var(--v-bg)}.step.D[aria-current="step"]{border-color:var(--d);background:var(--d-bg)}.step.A[aria-current="step"]{border-color:var(--a);background:var(--a-bg)}
.step.x[aria-current="step"]{border-color:var(--brand);background:var(--info-bg)}
.arrow{color:var(--muted);font-size:1rem}
.cycle{color:var(--v);font-weight:700;font-size:1.1rem}
.sepbar{width:1px;height:26px;background:var(--line);margin:0 4px}

/* fases */
.phase{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;border:1px solid}
.phase .big{width:52px;height:52px;border-radius:12px;color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:1.8rem;font-weight:700;flex:none}
.phase h2{margin:0;color:inherit}
.phase p{margin:0;font-size:.93rem}
.phase.E{background:var(--e-bg);border-color:var(--e);color:#143f70}.phase.E .big{background:var(--e)}
.phase.I{background:var(--i-bg);border-color:var(--i);color:#075a56}.phase.I .big{background:var(--i)}
.phase.V{background:var(--v-bg);border-color:var(--v);color:#703300}.phase.V .big{background:var(--v)}
.phase.D{background:var(--d-bg);border-color:var(--d);color:#4a2672}.phase.D .big{background:var(--d)}
.phase.A{background:var(--a-bg);border-color:var(--a);color:#7a1738}.phase.A .big{background:var(--a)}
.phase.x{background:var(--info-bg);border-color:var(--brand)}.phase.x .big{background:var(--brand)}
details.help{background:#fff;border:1px dashed #9aa3ae;border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:.92rem}
details.help summary{cursor:pointer;font-weight:600;color:var(--brand);min-height:32px;display:flex;align-items:center}
details.help .ex{background:var(--warn-bg);border-radius:6px;padding:8px 10px;margin-top:8px}
.item{border:1.5px solid var(--line);border-left-width:6px;border-radius:8px;padding:12px;margin-bottom:12px;background:#fff}
.item.E{border-left-color:var(--e)}.item.I{border-left-color:var(--i)}.item.V{border-left-color:var(--v)}.item.D{border-left-color:var(--d)}.item.A{border-left-color:var(--a)}
.item .ih{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.item .ih b{font-family:var(--serif)}
.st{font-size:.85rem;font-weight:600;margin:4px 0 0}
.st.ok{color:var(--ok)}.st.no{color:var(--err)}.st.op{color:var(--warn)}
.cols5{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.col{border-radius:8px;padding:10px;border:1.5px solid}
.col h4{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.col .ds{font-size:.8rem;margin-bottom:8px}
.col.hecho{background:#eaf1f9;border-color:#1f5fa8}.col.hecho h4{color:#143f70}
.col.inferencia{background:#e3f4f2;border-color:#0b7a75}.col.inferencia h4{color:#075a56}
.col.supuesto{background:#fcefdc;border-color:#a04a00}.col.supuesto h4{color:#703300}
.col.opinion{background:#f1f1f1;border-color:#666}.col.opinion h4{color:#333}
.col.hipotesis{background:#f0e9f8;border-color:#6a3aa0}.col.hipotesis h4{color:#4a2672}
.col .mini{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.col .mini textarea{min-height:60px}
.refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.refs label{font-size:.78rem;border:1px solid #9aa3ae;border-radius:5px;padding:2px 7px;cursor:pointer;background:#fff;display:inline-flex;gap:4px;align-items:center}
.refs label:has(input:checked){background:var(--e-bg);border-color:var(--e);font-weight:700}
.refs input{margin:0}

/* tablas */
.tw{overflow-x:auto;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#efece4;font-weight:600}
td select{min-width:70px;padding:4px 6px;min-height:36px}
td input[type=text]{min-height:36px}
tfoot td{font-weight:700;background:#faf8f2}

/* panel */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.stat b{font-family:var(--serif);font-size:2rem;color:var(--brand);display:block;line-height:1}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.act{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.act h3{margin:0}
.mi{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-left:4px solid var(--v);background:#fff;padding:8px 12px;margin-bottom:8px;border-radius:0 6px 6px 0;font-size:.9rem}
.hist li.refuerzo{border-color:var(--ok)}.hist li.cambio{border-color:var(--a)}
.hist small{color:var(--muted)}

/* pie fijo regla IA */
.iarule{position:fixed;left:0;right:0;bottom:0;background:#17375e;color:#fff;padding:8px 16px;font-size:.88rem;z-index:30;border-top:3px solid #f2a900}
.iarule .wrap{display:flex;gap:10px;align-items:center}
.iarule b{color:#ffd77a;white-space:nowrap}

/* modal */
.mback{position:fixed;inset:0;background:rgba(20,28,40,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.toast{position:fixed;right:16px;bottom:64px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:70;font-size:.9rem}

/* informe */
.rep{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px;margin-bottom:20px}
.rep h1{font-size:1.6rem;border-bottom:3px solid var(--brand);padding-bottom:6px}
.rep h2{margin-top:1.4rem;padding:4px 10px;border-radius:6px;font-size:1.15rem}
.rep h2.E{background:var(--e-bg);color:#143f70}.rep h2.I{background:var(--i-bg);color:#075a56}.rep h2.V{background:var(--v-bg);color:#703300}.rep h2.D{background:var(--d-bg);color:#4a2672}.rep h2.A{background:var(--a-bg);color:#7a1738}.rep h2.x{background:var(--info-bg)}
.rep .kv{display:grid;grid-template-columns:200px 1fr;gap:4px 12px;font-size:.92rem}
.rep .kv dt{font-weight:600;color:var(--muted)}.rep .kv dd{margin:0}
.arg{border:1.5px solid var(--a);border-radius:10px;overflow:hidden}
.arg>div{padding:10px 14px;border-bottom:1px solid #eac3d0}.arg>div:last-child{border-bottom:0}
.arg b{display:block;color:var(--a);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
.arg .tesis{background:var(--a-bg);font-family:var(--serif);font-size:1.1rem}
.fb{background:#f3f7e8;border:1.5px solid #8aa845;border-radius:8px;padding:10px;margin:8px 0}
.fb b{font-size:.85rem;color:#3d5a10}
.bad{display:inline-block;border:2px solid;border-radius:6px;padding:2px 10px;font-weight:700;font-size:.8rem;margin-left:8px;vertical-align:middle}
.bad.b{color:#7a4b00;border-color:#c98a00}.bad.f{color:var(--ok);border-color:var(--ok)}.bad.d{color:#4f3000;border-color:#c98a00;background:#fff3d6}
.print-only{display:none}
.empty{color:var(--muted);font-style:italic}

@media (max-width:760px){
  .g2,.g3,.g4,.g5,.tipos{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .nav a{padding:8px 9px;font-size:.88rem}
  .step .lb{display:none}.step[aria-current="step"] .lb{display:inline}
  .phase{flex-direction:row}
  .rep{padding:14px}.rep .kv{grid-template-columns:1fr}
  .iarule{font-size:.78rem;padding:6px 10px}
  .worktop{position:static}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:10.5pt}
  .top,.foot,.iarule,.noprint,.toast,.nav,.worktop,.btn,.mback{display:none!important}
  main{padding:0}
  .wrap{max-width:none;padding:0}
  .rep{border:0;padding:0;margin:0;break-after:page}
  .rep:last-child{break-after:auto}
  .print-only{display:block}
  .screen-only{display:none!important}
  table{font-size:8.5pt}th,td{padding:3px 4px}
  h2{break-after:avoid}.item,.arg,tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
const clone=o=>JSON.parse(JSON.stringify(o));
const ahora=()=>new Date().toISOString();
/* ====== Estado, almacenamiento local, validaciones y retroalimentación orientativa ====== */
const KEY='evida.asistente.v1';
let S,CUR=null,memOnly=false,tmrSave=null;
const txt=v=>(v==null?'':String(v)).trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const lab=(arr,k)=>{const f=arr.find(x=>x[0]===k);return f&&k?f[1]:''};

function estadoInicial(){return{v:1,rol:'estudiante',estudiante:{nombre:'',grupo:''},
 config:{asignaturas:clone(ASIG_BASE),actividades:[],criterios:CRIT_DEF.slice(),rubrica:{pesos:{E:1,I:1,V:1,D:1,A:1},desc:clone(DESC_DEF)}},trabajos:[]}}
function migrar(o){const d=estadoInicial();o=Object.assign(d,o);const c=o.config;
 c.asignaturas=c.asignaturas||d.config.asignaturas;c.actividades=c.actividades||[];c.criterios=c.criterios||CRIT_DEF.slice();
 c.rubrica=c.rubrica||d.config.rubrica;c.rubrica.pesos=Object.assign({E:1,I:1,V:1,D:1,A:1},c.rubrica.pesos);c.rubrica.desc=c.rubrica.desc||clone(DESC_DEF);
 o.trabajos=(o.trabajos||[]).map(t=>Object.assign(nuevoTrabajo(),t));return o}
function cargar(){try{const r=localStorage.getItem(KEY);if(r)return migrar(JSON.parse(r))}catch(e){memOnly=true}return estadoInicial()}

 el.textContent=ok?`Guardado en este navegador · ${h}`:'No se pudo guardar en el navegador: exporta una copia (Portafolio › Copia de seguridad)'}

 ctx:{asignaturaId:'',unidad:'',tema:'',tipo:'',actividadId:'',titulo:'',problema:'',ra:'',entregable:'',fecha:'',participacion:'individual',integrantes:'',indicaciones:'',contextoPractico:'',plan:''},
 E:{items:[],vacios:''},
 I:{significado:'',relaciones:'',items:[],alternativas:[],sinAlt:false,justAlt:'',noConcluir:''},
 V:{items:[]},
 D:{alternativas:[],criterios:[],puntajes:{},riesgos:'',decision:'',confianza:'',incertidumbres:'',provisional:false},
 A:{tesis:'',evidenciaIds:[],evidenciaClave:'',razonamiento:'',criterios:'',objecion:'',respuesta:'',limitaciones:'',nuevaEvidencia:''},
 IA:{uso:'',entries:[]},
 comp:{aportes:[],cierre:'',productos:[],observaciones:[],prueba:'',decisionAplicada:'',resultados:'',fuentes:[],bitacora:[],metacognicion:'',autoeval:{E:'',I:'',V:'',D:'',A:''},autoevalTxt:''},
 historial:[],feedback:{E:'',I:'',V:'',D:'',A:'',general:''},rubricaDoc:{E:'',I:'',V:'',D:'',A:'',comentario:'',revisado:false}}}

/* ---- búsqueda de datos configurados ---- */
const asigDe=id=>S.config.asignaturas.find(a=>a.id===id);
const subj=w=>Object.assign({},ASIG_GENERICA,asigDe(w.ctx.asignaturaId)||{});
const actDe=w=>S.config.actividades.find(a=>a.id===w.ctx.actividadId);
function pesosDe(w){const a=w&&actDe(w);const p=Object.assign({},S.config.rubrica.pesos);if(a&&a.pesos)Object.keys(a.pesos).forEach(k=>{if(a.pesos[k]!==''&&a.pesos[k]!=null)p[k]=+a.pesos[k]});return p}
function puntaje20(sc,p){let num=0,den=0;['E','V','I','D','A'].forEach(k=>{const v=+sc[k];if(v>=1&&v<=4){num+=v*(+p[k]||0);den+=4*(+p[k]||0)}});return den?Math.round(num/den*200)/10:null}
const todasDims=sc=>['E','V','I','D','A'].every(k=>+sc[k]>=1&&+sc[k]<=4);

/* ---- reglas de trazabilidad ---- */
const RX_IA=/(^|[^a-záéíóúñ])(chat\s?-?gpt|gpt-?\d?|gemini|copilot|claude|deepseek|perplexity|llama|bard|grok|mistral|inteligencia artificial|ia generativa|ia)(?![a-záéíóúñ])/i;
const fuenteEsIA=t=>RX_IA.test(txt(t));
const RX_CAUSAL=/(^|[^a-záéíóúñ])(porque|causa|causas|causó|causan|provoca|provocan|provocó|debido a|se debe a|produce|producen|genera|generan|ocasiona|ocasionan|origina|originan|por lo tanto|por eso|a causa de|resultado de|efecto de)(?![a-záéíóúñ])/i;
function faltasEv(x){const f=[];if(!txt(x.afirmacion))f.push('la afirmación o dato');
 if(!txt(x.fuente))f.push('la fuente o procedencia');else if(fuenteEsIA(x.fuente))f.push('una fuente comprobable (una herramienta de IA no es una fuente)');
 if(!txt(x.autor)&&!txt(x.enlace))f.push('autor/entidad o enlace/referencia');
 if(x.viaIA&&!txt(x.enlace))f.push('el enlace o referencia donde comprobaste lo que dijo la IA');return f}
const esTrazable=x=>x.cat!=='opinion'&&!faltasEv(x).length;
const admisibles=w=>{const a=actDe(w);return a&&a.admisibles&&a.admisibles.length?a.admisibles:null};
const evN=(w,id)=>{const i=w.E.items.findIndex(x=>x.id===id);return i<0?'?':'E'+(i+1)};

/* ---- validaciones por fase: {ok, err:[bloqueos], warn:[alertas]} ---- */
function vCtx(w){const c=w.ctx,err=[];
 if(!c.asignaturaId)err.push('Selecciona la asignatura.');if(!c.tipo)err.push('Selecciona el tipo de actividad (ACD, APE o AA).');
 if(!txt(c.titulo))err.push('Escribe el título de la actividad.');if(!txt(c.problema))err.push('Describe el problema, caso, reto o pregunta.');
 return{ok:!err.length,err,warn:[]}}
function vE(w){const it=w.E.items.filter(x=>txt(x.afirmacion)||txt(x.fuente)),err=[],warn=[];
 if(!it.some(esTrazable))err.push('Registra al menos una evidencia trazable: un dato verificable con fuente identificable (fuente, y autor o enlace).');
 const sinF=it.filter(x=>txt(x.afirmacion)&&!txt(x.fuente));
 if(sinF.length)warn.push(`${sinF.length} afirmación(es) sin fuente: ${sinF.map(x=>evN(w,x.id)).join(', ')}. Sin fuente, una afirmación no es evidencia.`);
 const ia=it.filter(x=>txt(x.fuente)&&fuenteEsIA(x.fuente));
 if(ia.length)warn.push(`${ia.map(x=>evN(w,x.id)).join(', ')}: una herramienta de IA no es una fuente. Úsala para buscar, pero registra el documento, dato o autor real que comprobaste.`);
 const via=it.filter(x=>x.viaIA&&!txt(x.enlace));
 if(via.length)warn.push(`${via.map(x=>evN(w,x.id)).join(', ')}: lo que dijo una IA no puede quedar como evidencia final; enlázalo a una fuente que puedas comprobar.`);
 const sec=it.filter(x=>x.cat!=='opinion'&&txt(x.afirmacion)&&(x.nivel==='secundaria'||x.nivel==='sintesis'));
 if(sec.length)warn.push(`Recomendación: ${sec.map(x=>evN(w,x.id)).join(', ')} proviene de fuente secundaria o síntesis. Busca la fuente primaria (el documento, dato u organismo original).`);
 const op=it.filter(x=>x.cat==='opinion'&&txt(x.afirmacion));
 if(op.length)warn.push(`${op.map(x=>evN(w,x.id)).join(', ')} está marcado como opinión: se conserva, pero no cuenta como evidencia verificable.`);
 const ad=admisibles(w);if(ad){const mal=it.filter(x=>x.tipo&&!ad.includes(x.tipo));if(mal.length)warn.push(`${mal.map(x=>evN(w,x.id)).join(', ')}: el tipo de evidencia no está entre los admitidos por tu docente (${ad.join(', ')}).`)}
 if(it.some(esTrazable)&&!it.some(x=>txt(x.vacios))&&!txt(w.E.vacios))warn.push('No has señalado vacíos de información. Casi siempre falta algo: ¿qué te gustaría saber y no tienes?');
 return{ok:!err.length,err,warn}}
function vI(w){const I=w.I,err=[],warn=[];
 if(!txt(I.significado))err.push('Explica con tus palabras qué significa la evidencia.');
 if(!I.items.some(x=>(x.cat==='inferencia'||x.cat==='hipotesis')&&txt(x.texto)))err.push('Formula al menos una inferencia o una hipótesis propia.');
 if(!I.alternativas.some(a=>txt(a.texto))&&!(I.sinAlt&&txt(I.justAlt)))err.push('Escribe al menos una interpretación alternativa, o marca «no aplica» y explica por qué.');
 if(!txt(I.noConcluir))err.push('Indica qué no se puede concluir todavía.');
 const cau=I.items.filter(x=>['inferencia','hipotesis','hecho'].includes(x.cat)&&RX_CAUSAL.test(txt(x.texto))&&!(x.ev&&x.ev.length));
 cau.forEach(x=>warn.push(`Posible causalidad sin evidencia vinculada: «${txt(x.texto).slice(0,70)}…». Una relación de causa necesita evidencia que la respalde; vincula evidencias o reformula como hipótesis.`));
 if(!txt(I.relaciones))warn.push('Describe qué relación existe entre los datos. Interpretar no es repetir datos.');
 if(!I.items.some(x=>x.cat==='supuesto'&&txt(x.texto)))warn.push('No declaraste supuestos. Siempre damos algo por cierto: ¿qué estás asumiendo?');
 if(I.items.length&&I.items.every(x=>x.cat==='hecho'||!txt(x.texto)))warn.push('Solo registraste hechos: eso es repetir datos. Añade qué significan (inferencias).');
 return{ok:!err.length,err,warn}}
const vVok=x=>txt(x.afirmacion)&&x.tipo&&x.resultado&&txt(x.como)&&txt(x.contraste)&&!fuenteEsIA(x.contraste);
function vV(w){const it=w.V.items,err=[],warn=[];
 if(!it.some(vVok))err.push('Registra al menos una verificación completa: qué verificaste, con qué contrastaste, cómo lo hiciste y qué resultó.');
 it.filter(x=>txt(x.contraste)&&fuenteEsIA(x.contraste)).forEach(x=>warn.push('Una respuesta de IA no sirve como fuente de contraste. Rastrea la fuente real que la IA menciona y regístrala.'));
 const sinV=w.E.items.filter(e=>e.relevancia==='alta'&&txt(e.afirmacion)&&!it.some(v=>v.ref===e.id&&vVok(v)));
 if(sinV.length)warn.push(`Evidencia de relevancia alta sin verificación documentada: ${sinV.map(e=>evN(w,e.id)).join(', ')}. Explica cómo verificaste la información importante.`);
 const rev=it.filter(x=>x.resultado==='contradice'||x.resultado==='matiza');
 rev.filter(x=>!txt(x.correccion)).forEach(x=>warn.push(`Una verificación «${lab(RESULTADOS,x.resultado).toLowerCase()}» pero no registraste corrección o cambio. ¿Qué cambiaste en tu evidencia?`));
 const debil=w.E.items.some(e=>e.confiabilidad==='baja'&&txt(e.afirmacion));
 return{ok:!err.length,err,warn,sinV,revisar:rev.length>0||it.some(x=>x.resultado==='noconcluyente')||debil,motivoRevisar:[rev.length?'una verificación contradice o matiza tu evidencia':'',it.some(x=>x.resultado==='noconcluyente')?'hay verificaciones no concluyentes':'',debil?'registraste una fuente de confiabilidad baja':''].filter(Boolean)}}
const critsOn=w=>w.D.criterios.filter(c=>c.on&&txt(c.nombre));
const altsOk=w=>w.D.alternativas.filter(a=>txt(a.nombre));
function vD(w){const D=w.D,err=[],warn=[];
 if(altsOk(w).length<2)err.push('Considera al menos dos alternativas y ponles nombre.');
 if(critsOn(w).length<2)err.push('Selecciona al menos dos criterios para comparar las alternativas.');
 if(!txt(D.riesgos))err.push('Describe los riesgos y consecuencias.');
 if(!txt(D.decision))err.push('Escribe tu decisión, solución, recomendación o conclusión.');
 if(!D.confianza)err.push('Indica tu nivel de confianza: bajo, medio o alto.');
 if(!txt(D.incertidumbres))err.push('Declara qué incertidumbres permanecen.');
 const sinEv=critsOn(w).filter(c=>!txt(c.evidencia));if(sinEv.length)warn.push(`Criterios sin evidencia que los respalde: ${sinEv.map(c=>c.nombre).join(', ')}.`);
 const falta=altsOk(w).length*critsOn(w).length-altsOk(w).reduce((n,a)=>n+critsOn(w).filter(c=>+D.puntajes[a.id+'|'+c.id]>0).length,0);
 if(falta>0)warn.push(`Faltan ${falta} casilla(s) de la matriz sin valorar.`);
 const vv=vV(w);if(D.confianza==='alto'&&(vv.revisar||vv.warn.length))warn.push('Indicas confianza alta, pero tu verificación tiene contradicciones, matices o pendientes. Revisa si tu confianza es proporcional a la evidencia.');
 return{ok:!err.length,err,warn}}
const A_CAMPOS=[['tesis','la tesis o decisión principal'],['evidenciaClave','la evidencia clave'],['razonamiento','el razonamiento que une evidencia y decisión'],['criterios','los criterios utilizados'],['objecion','una objeción o contraargumento'],['respuesta','la respuesta a la objeción'],['limitaciones','las limitaciones'],['nuevaEvidencia','qué nueva evidencia podría cambiar tu decisión']];
function vA(w){const err=[];A_CAMPOS.forEach(([k,n])=>{if(!txt(w.A[k]))err.push(`Falta ${n}.`)});return{ok:!err.length,err,warn:[]}}
const IA_CAMPOS=[['herramienta','herramienta utilizada'],['finalidad','finalidad de uso'],['instrucciones','resumen de instrucciones dadas'],['verificado','contenido verificado externamente'],['descartado','contenido descartado o corregido'],['aporte','aporte intelectual propio']];
const iaFalta=e=>IA_CAMPOS.filter(([k])=>!txt(e[k])).map(x=>x[1]);
function vIA(w){const IA=w.IA,err=[];
 if(!IA.uso)err.push('Indica si usaste o no inteligencia artificial en esta actividad.');
 if(IA.uso==='si'){if(!IA.entries.length)err.push('Registra al menos una herramienta de IA utilizada.');IA.entries.forEach((e,i)=>{const f=iaFalta(e);if(f.length)err.push(`Declaración de IA n.º ${i+1} incompleta: falta ${f.join(', ')}.`)})}
 return{ok:!err.length,err,warn:[]}}
function vComp(w){const c=w.comp,t=w.ctx.tipo,err=[],warn=[];
 if(t==='ACD'){if(!txt(c.cierre))err.push('Escribe el cierre reflexivo.');if(!c.aportes.some(a=>txt(a.texto)))warn.push('Aún no registraste aportes de la discusión.')}
 else if(t==='APE'){if(!c.observaciones.some(a=>txt(a.texto)))err.push('Registra al menos una observación.');if(!txt(c.prueba))err.push('Describe la prueba o contraste de la solución.');if(!txt(c.decisionAplicada))err.push('Describe la decisión aplicada.');if(!txt(c.resultados))err.push('Registra la evidencia de resultados.');if(!c.productos.some(a=>txt(a.texto)))warn.push('Aún no registraste productos o evidencias generadas.')}
 else if(t==='AA'){if(!c.fuentes.some(a=>txt(a.texto)))err.push('Registra al menos una fuente consultada.');if(!c.bitacora.some(a=>txt(a.texto)))err.push('Registra al menos una entrada en la bitácora de avance.');if(!txt(c.metacognicion))err.push('Escribe tu reflexión metacognitiva.');if(!todasDims(c.autoeval))err.push('Completa la autoevaluación con la rúbrica EVIDA (las cinco dimensiones).')}
 else err.push('Selecciona el tipo de actividad en el contexto.');
 return{ok:!err.length,err,warn}}

function retro(w){const R={},E=w.E.items.filter(x=>txt(x.afirmacion)),tr=E.filter(esTrazable);
 function nivel(conds,msgs){let n=0;for(const c of conds){if(c)n++;else break}return{nivel:Math.max(1,n),msgs}}
 // E
 {const m=[];const c1=tr.length>=1,c2=tr.length>=3||new Set(tr.map(x=>x.tipo).filter(Boolean)).size>=2,c3=tr.some(x=>x.nivel==='primaria'),c4=tr.every(x=>txt(x.fecha)&&txt(x.autor)&&(txt(x.enlace)))&&(E.some(x=>txt(x.vacios))||txt(w.E.vacios));
  if(!c1)m.push('Registra al menos una evidencia con fuente identificable.');else{if(!c2)m.push('Amplía la base: más de una evidencia o más de un tipo de evidencia.');if(!c3)m.push('Incluye al menos una fuente primaria.');if(!c4)m.push('Completa autor, fecha y enlace en todas las evidencias y señala vacíos de información.')}

 {const I=w.I,m=[];const c1=txt(I.significado)&&I.items.some(x=>(x.cat==='inferencia'||x.cat==='hipotesis')&&txt(x.texto));
  const c2=I.items.some(x=>x.cat==='supuesto'&&txt(x.texto))&&new Set(I.items.filter(x=>txt(x.texto)).map(x=>x.cat)).size>=3;

  if(!c1)m.push('Explica qué significa la evidencia y formula inferencias.');else{if(!c2)m.push('Declara supuestos y separa mejor hechos, inferencias y supuestos.');if(!c3)m.push('Formula una explicación alternativa.');if(!c4)m.push('Indica lo que no se puede concluir y respalda las relaciones de causa con evidencia.')}
  R.I=nivel([c1,c2,c3,c4],m)}
 // V
 {const V=w.V.items.filter(vVok),m=[];const c1=V.length>=1,c2=V.length>=2&&new Set(V.map(x=>x.tipo)).size>=2;
  const c3=V.some(x=>x.tipo==='contradictoria'||x.tipo==='primaria'||x.tipo==='triangulacion');
  const c4=!vV(w).sinV.length&&(V.some(x=>txt(x.correccion))||w.historial.length>0);
  if(!c1)m.push('Documenta al menos una verificación completa.');else{if(!c2)m.push('Usa más de un tipo de verificación.');if(!c3)m.push('Busca la fuente primaria, triangula o busca evidencia contradictoria.');if(!c4)m.push('Verifica la evidencia de relevancia alta y documenta correcciones o cambios de posición.')}
  R.V=nivel([c1,c2,c3,c4],m)}
 // D
 {const D=w.D,m=[];const c1=altsOk(w).length>=2&&txt(D.decision);const cs=critsOn(w);
  const c2=cs.length>=3&&altsOk(w).every(a=>cs.every(c=>+D.puntajes[a.id+'|'+c.id]>0));
  const c3=cs.every(c=>txt(c.evidencia))&&txt(D.riesgos);const c4=D.confianza&&txt(D.incertidumbres)&&!vD(w).warn.some(x=>x.startsWith('Indicas confianza alta'));
  if(!c1)m.push('Compara al menos dos alternativas y escribe tu decisión.');else{if(!c2)m.push('Usa tres o más criterios y valora todas las casillas.');if(!c3)m.push('Respalda cada criterio con evidencia y describe riesgos.');if(!c4)m.push('Declara confianza e incertidumbres de forma proporcional a tu verificación.')}
  R.D=nivel([c1,c2,c3,c4],m)}
 // A
 {const A=w.A,m=[];const c1=txt(A.tesis)&&txt(A.razonamiento);const c2=txt(A.evidenciaClave)&&txt(A.criterios);const c3=txt(A.objecion)&&txt(A.respuesta);const c4=txt(A.limitaciones)&&txt(A.nuevaEvidencia);
  if(!c1)m.push('Formula la tesis y el razonamiento.');else{if(!c2)m.push('Señala la evidencia clave y los criterios usados.');if(!c3)m.push('Incluye una objeción y respóndela.');if(!c4)m.push('Reconoce limitaciones e indica qué evidencia nueva cambiaría tu decisión.')}
  R.A=nivel([c1,c2,c3,c4],m)}

function vAyuda(){return `<h1>Guía breve de instalación y uso</h1>
 <div class="card"><h2>Instalación</h2><ol><li>Guarda el archivo <b>Asistente-Academico-EVIDA.html</b> en tu computador.</li><li>Ábrelo con un navegador actual (Chrome, Edge, Firefox o Safari). No necesita internet ni instalar nada.</li><li>Tu trabajo se guarda automáticamente <b>en ese navegador</b>. Usa siempre el mismo navegador y el mismo archivo; para cambiar de equipo usa «Exportar» e «Importar».</li><li>En el celular funciona igual: abre el archivo o alójalo en cualquier servidor web estático.</li></ol></div>
 <div class="card"><h2>Cómo se usa (estudiante)</h2><ol><li><b>Nueva actividad</b>: elige asignatura, tipo (ACD, APE o AA) y escribe el problema.</li><li><b>E · Evidencia</b>: registra datos con su fuente, autor o enlace. Necesitas al menos una evidencia trazable.</li><li><b>V · Verificación</b>: contrasta tu evidencia y documenta cómo lo hiciste. Si aparecen contradicciones o fuentes débiles, usa «Volver y revisar Evidencia».</li><li><b>I · Interpretación</b>: explica qué significa la evidencia verificada, separa hechos, inferencias, supuestos, opiniones e hipótesis, y piensa en otra explicación.</li><li><b>D · Decisión</b>: compara alternativas con criterios explícitos y declara tu confianza.</li><li><b>A · Argumentación</b>: tesis, evidencia, razonamiento, objeción, respuesta y límites.</li><li>Completa el <b>registro de la actividad</b>, la <b>declaración de IA</b> y descarga tu <b>informe</b> (imprimir → Guardar como PDF).</li></ol></div>
 <div class="card"><h2>Cómo se usa (docente)</h2><p>Pulsa «Docente» arriba. En <b>Asignaturas</b> cargas unidades, temas, resultados de aprendizaje y sugerencias; en <b>Actividades</b> diseñas ACD, APE y AA con evidencia admisible y ponderaciones; en <b>Rúbrica y criterios</b> editas descriptores y pesos; en <b>Portafolios</b> revisas los trabajos, dejas retroalimentación por fase y ajustas puntajes. Para distribuir tu configuración, usa <b>Datos › Exportar configuración</b> y pide a tus estudiantes importarla; ellos te devuelven su portafolio con «Exportar mis actividades» y tú lo importas en <b>Datos</b>.</p><p class="hint">Importante: el cambio de rol no tiene contraseña; la herramienta funciona de forma local. Para un uso institucional con cuentas deberá conectarse a un servidor con autenticación.</p></div>
 <div class="card"><h2>Glosario sin tecnicismos</h2><dl class="kv"><dt>Evidencia</dt><dd>Dato o hecho que otra persona puede encontrar y comprobar.</dd><dt>Fuente primaria</dt><dd>El origen del dato (la norma, el registro, la entrevista, el informe original).</dd><dt>Fuente secundaria</dt><dd>Alguien que comenta o resume la fuente primaria.</dd><dt>Inferencia</dt><dd>Lo que tú concluyes a partir de los datos; no es el dato.</dd><dt>Supuesto</dt><dd>Algo que das por cierto sin haberlo comprobado.</dd><dt>Triangulación</dt><dd>Comprobar algo con varias fuentes independientes.</dd><dt>Trazable</dt><dd>Que se puede seguir el rastro hasta su origen.</dd><dt>Causalidad</dt><dd>Decir que algo produce otra cosa; necesita más evidencia que decir que ocurren juntas.</dd></dl></div>
 <div class="callout info"><b class="t">${REGLA_IA}</b></div>
 <div class="card"><h2>Alcance de EVIDA</h2><p>EVIDA es una propuesta didáctica transversal, iterativa y orientada al razonamiento crítico, la toma de decisiones fundamentada y el uso responsable de IA. Se formula como propuesta conceptual y operativa <b>pendiente de validación empírica</b>; esta herramienta no afirma resultados de eficacia ni reemplaza la evaluación docente. Fuente metodológica: Documento Fundacional «Metodología EVIDA», v1.0, 2026.</p></div>`}

 const aviso=`<div class="callout info"><b class="t">Modo docente / administrador</b>Aquí configuras asignaturas, actividades y rúbricas, y revisas portafolios. No inventes datos oficiales: esta herramienta no trae resultados de aprendizaje, fechas ni actividades de cada asignatura; los cargas tú.</div>`;
 switch(s){case 'asignaturas':return aviso+dAsig();case 'actividades':return aviso+(p[2]?dActEd(p[2]):dActList());case 'rubrica':return dRub();case 'portafolios':return dPort();case 'revision':return dRev();case 'datos':return dDatos();default:return aviso+dAsig()}}

/* ---- Asignaturas ---- */
function dAsig(){const A=S.config.asignaturas;
 return `<h1>Asignaturas, unidades y sugerencias</h1><p>Edita los nombres, carga unidades, temas y resultados de aprendizaje, y ajusta las sugerencias (genéricas) que ve el estudiante.</p>
 ${A.map((a,i)=>`<details class="card" data-oid="as${a.id}"${op('as'+a.id)}><summary><b>${esc(a.nombre||'(sin nombre)')}</b> <span class="hint">· ${a.unidades.length} unidad(es)</span></summary>
 <div class="mt">${F(`c:asignaturas.${i}.nombre`,'Nombre de la asignatura')}
 <h3>Unidades</h3>${a.unidades.map((u,j)=>`<div class="item x"><div class="ih"><b>Unidad ${j+1}</b><button class="btn sm dng" data-act="delUni" data-a="${i}" data-b="${j}">Quitar</button></div>${F(`c:asignaturas.${i}.unidades.${j}.nombre`,'Nombre de la unidad')}<div class="grid g2"><div class="field"><label for="t${i}_${j}">Temas (uno por línea)</label><textarea id="t${i}_${j}" rows="3" data-lines="c:asignaturas.${i}.unidades.${j}.temas">${esc(lines(u.temas))}</textarea></div><div class="field"><label for="r${i}_${j}">Resultados de aprendizaje (uno por línea)</label><textarea id="r${i}_${j}" rows="3" data-lines="c:asignaturas.${i}.unidades.${j}.ra">${esc(lines(u.ra))}</textarea></div></div></div>`).join('')||'<p class="empty">Sin unidades cargadas.</p>'}
 <button class="btn sm" data-act="addUni" data-a="${i}">+ Añadir unidad</button>
 <h3 class="mt">Adaptación orientativa para el estudiante (editable)</h3>${F(`c:asignaturas.${i}.enfoque`,'Enfoque (separa los temas con «·»)',{type:'textarea',rows:2})}${F(`c:asignaturas.${i}.fuentes`,'Fuentes de evidencia que suelen servir',{type:'textarea',rows:2})}${F(`c:asignaturas.${i}.criterios`,'Criterios de decisión sugeridos (separados por coma)',{})}
 ${FASES.map(f=>F(`c:asignaturas.${i}.ejemplos.${f.k}`,`Ejemplo orientativo — fase ${f.k} (${f.n})`,{type:'textarea',rows:2})).join('')}
 <button class="btn sm dng" data-act="delAsig" data-a="${i}">Eliminar asignatura</button></div></details>`).join('')}
 <button class="btn" data-act="addAsig">+ Añadir asignatura</button>`}
ACT.addUni=i=>{OPEN['as'+S.config.asignaturas[+i].id]=true;S.config.asignaturas[+i].unidades.push({id:uid(),nombre:'',temas:[],ra:[]});guardar();rerender()};
ACT.delUni=(i,j)=>{OPEN['as'+S.config.asignaturas[+i].id]=true;S.config.asignaturas[+i].unidades.splice(+j,1);guardar();rerender()};
ACT.addAsig=()=>{const a={id:uid(),nombre:'Nueva asignatura',unidades:[],enfoque:'',fuentes:'',criterios:'',ejemplos:{E:'',I:'',V:'',D:'',A:''}};S.config.asignaturas.push(a);OPEN['as'+a.id]=true;guardar();rerender()};
ACT.delAsig=i=>{const a=S.config.asignaturas[+i];confirmar('Eliminar asignatura',`¿Eliminar «${esc(a.nombre)}»? Las actividades configuradas y los trabajos de estudiantes que la usan perderán su asignatura.`,()=>{S.config.asignaturas.splice(+i,1);guardarYa();rerender()},'Eliminar','dng')};

/* ---- Actividades ---- */
function dActList(){const L=S.config.actividades;
 return `<h1>Actividades configuradas</h1><p>Diseña actividades ACD, APE y AA. Los estudiantes podrán elegirlas al crear su trabajo.</p><div class="row mb"><button class="btn pri" data-act="addAct">+ Nueva actividad</button></div>
 ${L.length?`<div class="tw"><table><thead><tr><th>Título</th><th>Asignatura</th><th>Tipo</th><th>Fecha</th><th></th></tr></thead><tbody>${L.map((a,i)=>`<tr><td>${esc(a.titulo||'(sin título)')}</td><td>${esc((asigDe(a.asignaturaId)||{}).nombre||'—')}</td><td>${a.tipo}</td><td>${esc(a.fecha||'—')}</td><td class="row"><a class="btn sm" href="#/docente/actividades/${a.id}">Editar</a><button class="btn sm" data-act="dupAct" data-a="${i}">Duplicar</button><button class="btn sm dng" data-act="delAct" data-a="${i}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card"><p class="empty">Aún no hay actividades cargadas. Los estudiantes pueden definir las suyas mientras tanto (se marcará que no son oficiales).</p></div>'}`}
ACT.addAct=()=>{const a={id:uid(),asignaturaId:S.config.asignaturas[0]?S.config.asignaturas[0].id:'',unidad:'',tipo:'ACD',titulo:'',consigna:'',ra:'',entregable:'',fecha:'',indicaciones:'',admisibles:[],criteriosDecision:'',criteriosEval:'',pesos:{E:'',I:'',V:'',D:'',A:''}};S.config.actividades.push(a);guardarYa();nav('docente/actividades/'+a.id)};
ACT.dupAct=i=>{const a=clone(S.config.actividades[+i]);a.id=uid();a.titulo+=' (copia)';S.config.actividades.push(a);guardarYa();rerender()};
ACT.delAct=i=>{const a=S.config.actividades[+i];confirmar('Eliminar actividad',`¿Eliminar «${esc(a.titulo)}»?`,()=>{S.config.actividades.splice(+i,1);guardarYa();if(ruta()[2])nav('docente/actividades');else rerender()},'Eliminar','dng')};
function dActEd(id){const i=S.config.actividades.findIndex(a=>a.id===id);if(i<0)return dActList();const a=S.config.actividades[i],as=asigDe(a.asignaturaId),un=as?as.unidades:[],p=`c:actividades.${i}.`;
 const uSel=un.find(u=>u.nombre===a.unidad);
 return `<p><a href="#/docente/actividades">← Volver a actividades</a></p><h1>Diseñar actividad</h1>
 <div class="card"><div class="grid g2">${F(p+'asignaturaId','Asignatura',{type:'select',rr:1,opts:S.config.asignaturas.map(x=>[x.id,x.nombre])})}
 ${R(p+'tipo','Tipo de actividad',Object.keys(TIPOS).map(k=>[k,k+' — '+TIPOS[k].n.split(' ').slice(0,4).join(' ')+'…']))}</div>
 <div class="grid g2">${un.length?F(p+'unidad','Unidad',{type:'select',rr:1,opts:[['','—']].concat(un.map(u=>[u.nombre,u.nombre]))}):F(p+'unidad','Unidad o tema',{help:'La asignatura no tiene unidades cargadas.'})}${F(p+'fecha','Fecha límite',{type:'date'})}</div>
 ${F(p+'titulo','Título de la actividad',{req:1})}${F(p+'consigna','Problema, caso, reto, pregunta o consigna',{type:'textarea',rows:4})}
 <datalist id="dl-ra">${(uSel?uSel.ra||[]:[]).map(r=>`<option value="${esc(r)}">`).join('')}</datalist>${F(p+'ra','Resultado de aprendizaje',{list:'dl-ra',help:'Escríbelo o elige uno de los cargados en la unidad. No se inventa ninguno.'})}
 ${F(p+'entregable','Entregable esperado')}${a.tipo==='ACD'?F(p+'indicaciones','Indicaciones del docente (ACD)',{type:'textarea',rows:3}):''}</div>
 <div class="card"><h3>Evidencia admisible</h3><p class="hint">Marca los tipos de evidencia permitidos. Si no marcas ninguno, se admiten todos.</p><div class="radios">${TIPOS_EV.slice(1).map(t=>`<label><input type="checkbox" data-arr="c:actividades.${i}.admisibles" data-val="${t[0]}"${(a.admisibles||[]).includes(t[0])?' checked':''}> ${t[1]}</label>`).join('')}</div>
 ${F(p+'criteriosDecision','Criterios de decisión sugeridos para esta actividad (separados por coma)',{help:'Si lo dejas vacío se usan los de la asignatura. Opciones genéricas: '+S.config.criterios.join(', ')})}
 ${F(p+'criteriosEval','Criterios de evaluación de la actividad',{type:'textarea',rows:3})}</div>
 <div class="card"><h3>Ponderación de la rúbrica EVIDA en esta actividad</h3><p class="hint">Déjalo vacío para usar la ponderación general. El total siempre se expresa sobre 20.</p><div class="grid g5">${['E','V','I','D','A'].map(k=>F(`${p}pesos.${k}`,`Peso ${k}`,{type:'number',min:0,max:10,ph:String(S.config.rubrica.pesos[k])})).join('')}</div></div>`}

/* ---- Rúbrica ---- */
function dRub(){const R_=S.config.rubrica;
 return `<h1>Rúbrica EVIDA y criterios genéricos</h1><p>Cinco dimensiones valoradas de 1 a 4 (total 20 puntos). Puedes editar los descriptores y las ponderaciones. Los descriptores iniciales provienen del Documento Fundacional EVIDA v1.0.</p>
 <div class="card"><h3>Ponderación general</h3><div class="grid g5">${['E','V','I','D','A'].map(k=>F(`c:rubrica.pesos.${k}`,`Peso ${k} — ${FASES.find(f=>f.k===k).n}`,{type:'number',min:0,max:10})).join('')}</div></div>
 <div class="card"><h3>Descriptores por nivel</h3>${['E','V','I','D','A'].map(k=>`<h4>${k} — ${FASES.find(f=>f.k===k).n}</h4><div class="grid g4">${[1,2,3,4].map(n=>F(`c:rubrica.desc.${k}.${n}`,`${n} · ${NIVELES[n]}`,{type:'textarea',rows:3})).join('')}</div>`).join('')}<button class="btn sm" data-act="resetRub">Restablecer descriptores iniciales</button></div>
 <div class="card"><h3>Criterios genéricos para la matriz de decisión</h3><div class="field"><label for="crg">Un criterio por línea</label><textarea id="crg" rows="8" data-lines="c:criterios">${esc(lines(S.config.criterios))}</textarea></div></div>`}
ACT.resetRub=()=>{S.config.rubrica.desc=clone(DESC_DEF);guardar();rerender()};

/* ---- Portafolios ---- */
CHG.fAsig=v=>{FILT.asig=v;rerender()};CHG.fEst=v=>{FILT.est=v;rerender()};
function dPort(){const T=S.trabajos.filter(t=>(!FILT.asig||t.ctx.asignaturaId===FILT.asig)&&(!FILT.est||(t.estudiante||'').toLowerCase().includes(FILT.est.toLowerCase())));
 return `<h1>Portafolios de estudiantes</h1><p>Revisa el progreso, las alertas de campos incompletos y la declaración de uso de IA, y deja retroalimentación por fase.</p>
 <div class="card"><div class="grid g2"><div class="field"><label for="fa">Filtrar por asignatura</label><select id="fa" data-chg="fAsig"><option value="">Todas</option>${S.config.asignaturas.map(a=>`<option value="${a.id}"${FILT.asig===a.id?' selected':''}>${esc(a.nombre)}</option>`).join('')}</select></div><div class="field"><label for="fe">Filtrar por estudiante</label><input id="fe" type="text" value="${esc(FILT.est)}" data-chg="fEst"><p class="hint">Escribe y presiona Tab o Enter.</p></div></div></div>
 ${T.length?`<div class="tw"><table><thead><tr><th>Estudiante</th><th>Actividad</th><th>Asignatura · tipo</th><th>Avance</th><th>Fase actual</th><th>Alertas</th><th>Uso de IA</th><th>Puntaje docente /20</th><th></th></tr></thead><tbody>${T.map(t=>{const st=estado(t),al=alertas(t,st),inc=['E','V','I','D','A','IA'].filter(k=>!st[k].ok).length,sd=todasDims(t.rubricaDoc)?puntaje20(t.rubricaDoc,pesosDe(t)):null;
  return `<tr><td>${esc(t.estudiante||'(sin nombre)')}</td><td>${esc(t.ctx.titulo||'(sin título)')}${t.demo?' <span class="chip demo">Ejemplo</span>':''}</td><td>${esc((asigDe(t.ctx.asignaturaId)||{}).nombre||'—')} · ${t.ctx.tipo||'—'}</td><td>${st.pct}% · ${st.txt}</td><td>${st.fase==='informe'?'Completa':NOMBRE_PASO[st.fase]}</td><td>${al.length?al.map(x=>`<span class="chip err">${x}</span>`).join(''):''}${inc?`<span class="chip warn">${inc} fase(s) incompleta(s)</span>`:'<span class="chip ok">Sin pendientes</span>'}</td><td>${t.IA.uso==='si'?'Sí ('+t.IA.entries.length+')':t.IA.uso==='no'?'No':'Sin declarar'}${t.IA.uso==='si'&&!st.IA.ok?' <span class="chip err">incompleta</span>':''}</td><td>${sd==null?'—':sd}${t.rubricaDoc.revisado?' ✓':''}</td><td><a class="btn sm pri" href="#/docente/revision/${t.id}">Revisar</a></td></tr>`}).join('')}</tbody></table></div>`:'<div class="card"><p class="empty">No hay portafolios para mostrar. Importa los archivos de tus estudiantes en «Datos», o carga una actividad demostrativa desde el panel del estudiante.</p></div>'}`}
function dRev(){const w=CUR,st=estado(w);LIVE=null;
 const inc=[['ctx','Contexto'],['E','Evidencia'],['V','Verificación'],['I','Interpretación'],['D','Decisión'],['A','Argumentación'],['comp','Registro de la actividad'],['IA','Declaración de IA']].filter(([k])=>!st[k].ok);
 return `<p><a href="#/docente/portafolios">← Portafolios</a></p>
 <div class="row sp"><h1>Revisión: ${esc(w.ctx.titulo||'(sin título)')}</h1><div class="row"><button class="btn" data-act="print">Imprimir / PDF</button><button class="btn" data-act="expUno">Exportar con retroalimentación (.json)</button></div></div>
 <p>Estudiante: <b>${esc(w.estudiante||'(sin nombre)')}</b> · Avance <b>${st.pct}%</b> · ${st.txt}${w.demo?' · <b>EJEMPLO ORIENTATIVO</b>':''}</p>
 ${inc.length?`<div class="callout warn"><b class="t">Alertas de campos incompletos</b><ul>${inc.map(([k,n])=>`<li><b>${n}</b>: ${esc(st[k].err.join(' '))}</li>`).join('')}</ul></div>`:'<div class="callout ok">Todos los campos mínimos están completos.</div>'}
 <div class="callout info"><b class="t">Retroalimentación automática ≠ evaluación.</b>Debajo ves la orientación automática, la autoevaluación del estudiante y tu valoración. Tus puntajes y comentarios son los que cuentan.</div>
 ${informeHTML(w,{fb:'edit'})}
 <div class="card">${CK('w:rubricaDoc.revisado','Marcar esta revisión como completa')}<p class="hint">Para devolver tu retroalimentación al estudiante, usa «Exportar con retroalimentación» y envíale el archivo para que lo importe en «Mi portafolio».</p></div>`}
